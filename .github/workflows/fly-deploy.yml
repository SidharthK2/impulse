# Deploy the exchange to Fly.io whenever the server changes on main (crates/, Cargo.*, Dockerfile, fly.toml),
# or on demand: Actions tab → "Deploy to Fly" → Run workflow, or `gh workflow run fly-deploy.yml`.
# Every deploy restarts the server: it snapshots on SIGTERM and replays its journal on start, and the web app's
# websocket reconnects by itself. Pushes that only touch web/ or docs don't deploy here.
# Needs the repo secret FLY_API_TOKEN: `fly tokens create deploy -x 999999h`, then add it under
# Settings → Secrets and variables → Actions. The image is built on Fly's remote builder, not on the runner.
name: Deploy to Fly

on:
  push:
    branches: [main]
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", "Dockerfile", "fly.toml", ".github/workflows/fly-deploy.yml"]
  workflow_dispatch:

# One deploy at a time; a second run waits rather than racing the running one.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

# The deploy authenticates with FLY_API_TOKEN, not the GitHub token, so the token only needs to read the code.
permissions:
  contents: read

jobs:
  # A deploy only goes out if the commit passes the same Rust checks as CI (this runs alongside CI, not after it).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      # The version in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Fly's remote builder; a cold build takes a few minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      # A release tag, not @master, so a deploy never picks up an unreleased change to the action.
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      # --ha=false: exactly one machine; the exchange can't run as two copies over one volume.
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
