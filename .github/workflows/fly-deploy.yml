# Deploy to Fly.io on demand only: Actions tab → "Deploy to Fly" → Run workflow, or `gh workflow run fly-deploy.yml`.
# It deploys the chosen branch (main by default). Pushes don't deploy.
# Needs the repo secret FLY_API_TOKEN: `fly tokens create deploy -x 999999h`, then add it under
# Settings → Secrets and variables → Actions. The image is built on Fly's remote builder, not on the runner.
name: Deploy to Fly

on:
  workflow_dispatch:

# One deploy at a time; a second run waits rather than racing the running one.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # --ha=false: exactly one machine; the exchange can't run as two copies over one volume.
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
