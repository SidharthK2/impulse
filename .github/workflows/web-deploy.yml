# Deploy the web app to Cloudflare (a Worker with static assets, web/wrangler.jsonc) whenever web/ changes on main,
# or on demand: Actions tab → "Deploy web to Cloudflare" → Run workflow, or `gh workflow run web-deploy.yml`.
# It's a static upload; the exchange on Fly keeps running. Needs the repo secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID (docs/DEPLOY.md).
name: Deploy web to Cloudflare

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web-deploy.yml"]
  workflow_dispatch:

# One deploy at a time; a second run waits, so the last push is the one that ends up live.
concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install -g pnpm@11.6.0
      - run: pnpm install --frozen-lockfile --ignore-workspace
      # The same checks as CI, since this runs alongside it rather than after it. vite build doesn't typecheck.
      - run: pnpm run fmt:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build
      # npx keeps wrangler out of web/'s dependencies; pinned so a deploy never picks up a fresh release.
      - run: npx --yes wrangler@4.151.1 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
