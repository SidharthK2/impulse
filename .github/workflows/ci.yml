# Checks every push to main and every pull request. Rust: formatting, clippy, tests. Web: formatting, oxlint,
# typecheck, build. `make lint` runs the same checks locally, minus the tests and build.
# Deploys don't wait on this run; each deploy workflow repeats the checks it needs before it ships.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a PR branch makes the older run pointless. On main every commit finishes its run, so each one
# has a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Checks only read the code.
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    # The tests start real servers; a hang fails in 20 minutes instead of GitHub's 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      # Installs the version and components in rust-toolchain.toml (the same as the Dockerfile's rust:1.96).
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # -D warnings: any clippy warning fails the build.
      - run: cargo clippy --all-targets --locked -- -D warnings
      # --locked: fail if Cargo.lock is out of date rather than quietly resolving new versions.
      - run: cargo test --locked

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install -g pnpm@11.6.0
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: pnpm run fmt:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build
