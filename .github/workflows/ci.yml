# Checks every push to main and every pull request. Rust: formatting, clippy, tests. Web: formatting, oxlint,
# typecheck, build. `make lint` runs the same checks locally, minus the tests and build.
# Deploys don't wait on this run; each deploy workflow repeats the checks it needs before it ships.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The same toolchain as the Dockerfile (rust:1.96).
      - run: rustup toolchain install 1.96 --profile minimal --component rustfmt,clippy && rustup default 1.96
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # -D warnings: any clippy warning fails the build.
      - run: cargo clippy --all-targets --locked -- -D warnings
      # --locked: fail if Cargo.lock is out of date rather than quietly resolving new versions.
      - run: cargo test --locked

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install -g pnpm@11.6.0
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: pnpm run fmt:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build
