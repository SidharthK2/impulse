[package]
name = "impulse-server"
edition.workspace = true
version.workspace = true

[[bin]]
name = "impulse-server"
path = "src/main.rs"

[dependencies]
impulse-engine = { path = "../engine" }
serde.workspace = true
serde_json.workspace = true
indexmap = { version = "2", features = ["serde"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "signal", "sync", "net", "fs"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
