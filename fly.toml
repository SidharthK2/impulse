# Fly.io config for Impulse, sized for the lowest cost. One machine only: the whole exchange lives in one process,
# with its SQLite database on the volume below. Never scale this app past one machine. Setup: docs/DEPLOY.md.

app = "impulse-sid"
primary_region = "sin"    # Singapore; any region works (`fly platform regions`)

# The server takes a final snapshot on SIGTERM; give it time before the machine is killed.
kill_signal = "SIGTERM"
kill_timeout = "30s"
# Disk-backed swap is free; it covers memory spikes on the 256 MB machine.
swap_size_mb = 256

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  DATA_DIR = "/data"
  WEB_DIR = "/app/web/dist"
  # OFFLINE = "1"   # simulated prices instead of live Hyperliquid / Polymarket
  # BOTS = "0"      # no house market maker or noise traders
  # ADMIN_TOKEN is a secret: `fly secrets set ADMIN_TOKEN=...`

[mounts]
  source = "impulse_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # Stops when nobody is connected and starts on the next request, so it only costs while in use. While stopped,
  # the clock, bots and price feeds pause; the server treats downtime as a pause. For always-on, set
  # auto_stop_machines = "off" and min_machines_running = 1.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    # Startup replays the journal since the last snapshot before serving.
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
